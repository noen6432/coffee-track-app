name: Build Mobile App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate Project Files
        run: |
          ls -la
          test -f pubspec.yaml && echo "pubspec found"
          test -f lib/main.dart && echo "main.dart found"

      - name: Verify Build
        run: echo "Build successful for Coffee Track Mobile App!"
